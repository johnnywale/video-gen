name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            artifact: video-editor-macos-arm64
            bundle_paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: video-editor-windows-x64
            bundle_paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install ffmpeg pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(brew --prefix ffmpeg)/include" >> $GITHUB_ENV

      - name: Install FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z"
          $dest = "$env:RUNNER_TEMP\ffmpeg.7z"
          Invoke-WebRequest -Uri $url -OutFile $dest
          7z x $dest -o"$env:RUNNER_TEMP\ffmpeg-extract" -y | Out-Null
          $ffmpegDir = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg-extract" -Directory | Select-Object -First 1
          $finalDir = "C:\ffmpeg"
          Move-Item -Path $ffmpegDir.FullName -Destination $finalDir
          echo "FFMPEG_DIR=$finalDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$finalDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage FFmpeg DLLs for bundling (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dest = "src-tauri\ffmpeg-dlls"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "C:\ffmpeg\bin\*.dll" -Destination $dest -Force
          Get-ChildItem $dest

      - name: Build app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error
