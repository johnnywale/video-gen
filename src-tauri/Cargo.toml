[package]
name = "video-editor"
version = "0.1.0"
description = "A video editor built with Tauri and React"
authors = []
edition = "2021"

[lib]
name = "video_editor"
path = "src/lib.rs"

[[bin]]
name = "video-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffmpeg-next = "8"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
tempfile = "3"
rfd = "0.15"
# Lightweight blocking HTTP client for outbound API calls (AI title generation,
# TTS, music). Used inside spawn_blocking to keep the runtime async.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Cross-platform system font enumeration. fontdb walks the OS font dirs
# directly so we get on-disk paths (CoreText / DirectWrite return memory
# handles which we can't pass to ffmpeg's `drawtext=fontfile=…`).
fontdb = "0.21"
# `ttf-parser` reads the font's cmap directly so we can flag CJK-capable
# faces in the picker (so the default lands on something that renders
# Chinese instead of tofu).
ttf-parser = "0.25"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# Used by tests to decode extracted JPEG thumbnails and verify their
# dimensions / pixel content are valid (i.e. not just data-URL bytes).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
